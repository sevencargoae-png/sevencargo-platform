<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بوابة المندوب — SEVENCARGO</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06111c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/img/logo.png">
  <link rel="apple-touch-icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-scope="driver">
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="card login-card">
      <a href="/" class="brand"><img src="/img/logo.png" alt="SEVENCARGO"></a>
      <h2 class="center" data-i18n="d_login_title"></h2>
      <p class="center muted small" data-i18n="d_login_sub"></p>
      <div class="field"><label data-i18n="phone"></label><input id="l-phone" inputmode="tel" autocomplete="username" required dir="ltr" placeholder="05XXXXXXXX"></div>
      <div class="field"><label data-i18n="password"></label><input id="l-pass" type="password" autocomplete="current-password" required dir="ltr"></div>
      <div class="err" id="l-err"></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" data-i18n="login"></button>
      <div class="row" style="justify-content:space-between;margin-top:14px"><a href="/" class="small" data-i18n="home"></a><button type="button" class="btn btn-ghost btn-sm" data-lang-toggle>English</button></div>
    </form>
  </div>

  <div id="app-view" class="driver-shell hidden">
    <div class="driver-top">
      <img src="/img/logo.png" alt="" style="width:34px;height:30px;object-fit:contain">
      <div style="flex:1;min-width:0"><b id="d-name"></b><div class="small muted" id="d-sub"></div></div>
      <button class="btn btn-ghost btn-sm" data-lang-toggle>English</button>
      <button class="btn btn-ghost btn-sm" id="logout" data-i18n="logout"></button>
    </div>
    <div class="card duty-card" id="duty-card"></div>
    <div id="view"></div>
  </div>

  <nav class="bottom-nav hidden" id="bottom-nav">
    <button data-tab="orders" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8l-9-5-9 5v8l9 5z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg><span data-i18n="dt_orders"></span><span class="badge hidden" id="b-orders"></span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span data-i18n="dt_history"></span></button>
    <button data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i18n="dt_chat"></span><span class="badge hidden" id="b-chat"></span></button>
    <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span data-i18n="dt_report"></span></button>
    <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span data-i18n="dt_profile"></span><span class="badge hidden" id="b-notif"></span></button>
  </nav>

  <input type="file" id="cam" accept="image/*" capture="environment" class="hidden">

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/driver.js"></script>
</body>
</html>
